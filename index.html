<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pepina Pastel · Atención</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: three-pane helpdesk (nav rail · ticket list · conversation · customer card), collapsing to one pane on phones */
:root{
  --bg:#F6F1EA; --surface:#FFFFFF; --surface-2:#FBF7F2; --line:#E9DFD3; --line-2:#F2EBE2;
  --ink:#33251A; --muted:#7D6E61; --faint:#A99A8C;
  --brown:#714B28; --brown-ink:#FFFFFF; --brown-soft:#F3E9DE; --brown-mid:#A47A52;
  --sage:#899E9A; --sage-d:#5F7672; --sage-soft:#E3EAE8;
  --note:#FFF6DC; --note-line:#D9BE7A; --note-ink:#6E5A26;
  --agent-bubble:#714B28; --agent-ink:#FFFFFF;
  --wa:#3F6B4E; --wa-bg:#E3EEE6; --mail:#714B28; --mail-bg:#F3E9DE; --ig:#8A4A60; --ig-bg:#F2E6EA; --fb:#45597E; --fb-bg:#E4E9F2;
  --ok:#4E7A5A; --warn:#B07A2A; --shadow:0 18px 50px rgba(51,37,26,.18);
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1713; --surface:#26201B; --surface-2:#2D2620; --line:#3D342C; --line-2:#332B24;
  --ink:#F1E8DE; --muted:#B5A595; --faint:#8B7C6F;
  --brown:#C69567; --brown-ink:#1C1713; --brown-soft:#3A2D22; --brown-mid:#C69567;
  --sage:#8FA6A1; --sage-d:#A9C0BB; --sage-soft:#2A3331;
  --note:#3A321D; --note-line:#8A743C; --note-ink:#EAD59C;
  --agent-bubble:#5A3D23; --agent-ink:#F7EDE3;
  --wa:#9CCBA9; --wa-bg:#243229; --mail:#E0B98F; --mail-bg:#3A2D22; --ig:#E3A6BC; --ig-bg:#3A2830; --fb:#A9BCE0; --fb-bg:#262D3A;
  --ok:#9CCBA9; --warn:#E3B56E; --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1713; --surface:#26201B; --surface-2:#2D2620; --line:#3D342C; --line-2:#332B24;
  --ink:#F1E8DE; --muted:#B5A595; --faint:#8B7C6F;
  --brown:#C69567; --brown-ink:#1C1713; --brown-soft:#3A2D22; --brown-mid:#C69567;
  --sage:#8FA6A1; --sage-d:#A9C0BB; --sage-soft:#2A3331;
  --note:#3A321D; --note-line:#8A743C; --note-ink:#EAD59C;
  --agent-bubble:#5A3D23; --agent-ink:#F7EDE3;
  --wa:#9CCBA9; --wa-bg:#243229; --mail:#E0B98F; --mail-bg:#3A2D22; --ig:#E3A6BC; --ig-bg:#3A2830; --fb:#A9BCE0; --fb-bg:#262D3A;
  --ok:#9CCBA9; --warn:#E3B56E; --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brown-mid);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-columns:68px minmax(0,340px) minmax(0,1fr) 270px;grid-template-rows:auto minmax(0,1fr);
  padding-left:max(0px, env(safe-area-inset-left,0px));padding-right:max(0px, env(safe-area-inset-right,0px))}
.demo-bar{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:var(--sage-d);color:#fff;font-size:12px;padding-block:6px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));text-align:center}
:root[data-theme="dark"] .demo-bar{color:#1C1713}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .demo-bar{color:#1C1713}}

/* nav rail */
.rail{background:var(--brown);display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:14px}
:root[data-theme="dark"] .rail{background:#2E2219}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rail{background:#2E2219}}
.rail img{width:46px;margin-bottom:12px}
.rail button{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:rgba(255,255,255,.72);display:grid;place-items:center}
.rail button.on{background:rgba(255,255,255,.16);color:#fff}
.rail button svg{width:22px;height:22px}
.rail .spacer{flex:1}
.rail .me{width:36px;height:36px;border-radius:50%;background:var(--sage);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;border:2px solid rgba(255,255,255,.5)}

/* list pane */
.list{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list-head{padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line-2)}
.list-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.list-title h1{font-size:18px;margin:0;font-weight:600;letter-spacing:-.2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--brown-mid)}
.btn.primary{background:var(--brown);border-color:var(--brown);color:var(--brown-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn svg{width:16px;height:16px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.search input{border:0;background:transparent;outline:none;width:100%;min-width:0}
.search svg{width:16px;height:16px;color:var(--faint);flex:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:var(--surface-2);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:500}
.tab.on{background:var(--brown);color:var(--brown-ink)}
.tab .c{opacity:.75;margin-left:3px}
.chans{display:flex;gap:6px;flex-wrap:wrap}
.chf{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.chf svg{width:12px;height:12px}
.chf.on{border-color:var(--brown-mid);color:var(--ink);background:var(--brown-soft)}
.rows{overflow:auto;flex:1;min-height:0}
.row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line-2);background:transparent;padding:12px 16px 12px 13px;border-left:3px solid transparent}
.row:hover{background:var(--surface-2)}
.row.on{background:var(--brown-soft);border-left-color:var(--brown)}
.row .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row .who{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .when{font-size:11.5px;color:var(--faint);flex:none}
.row .ttl{font-size:13px;font-weight:500;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .prev{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.row .l3{display:flex;gap:6px;align-items:center;margin-top:7px;flex-wrap:wrap}
.row .unread{width:8px;height:8px;border-radius:50%;background:var(--brown);display:inline-block}
.row.is-unread .who,.row.is-unread .ttl{font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip svg{width:11px;height:11px}
.ch-email{background:var(--mail-bg);color:var(--mail)}
.ch-whatsapp{background:var(--wa-bg);color:var(--wa)}
.ch-instagram{background:var(--ig-bg);color:var(--ig)}
.ch-facebook{background:var(--fb-bg);color:var(--fb)}
.tid{font-size:11.5px;color:var(--faint)}
.st{font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.st-open{border-color:var(--brown-mid);color:var(--brown)}
.st-pending{border-color:var(--warn);color:var(--warn)}
.st-snoozed{border-color:var(--sage);color:var(--sage-d)}
.st-resolved{border-color:var(--ok);color:var(--ok)}
.who-chip{font-size:11px;color:var(--muted)}

/* conversation */
.conv{display:flex;flex-direction:column;min-height:0;background:var(--surface-2);min-width:0}
.conv-head{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{display:none;border:0;background:transparent;padding:4px;margin-left:-6px}
.back svg{width:22px;height:22px}
.conv-head .meta{min-width:0;flex:1 1 320px}
.conv-head .name{font-weight:600;font-size:15px}
.conv-head .sub{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.conv-head .subject{font-size:12.5px;color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select.sel{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface);font-size:13px}
.btn.res{background:var(--sage-d);border-color:var(--sage-d);color:#fff}
:root[data-theme="dark"] .btn.res{color:#1C1713}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.res{color:#1C1713}}
.btn.ghost{border-style:dashed;color:var(--muted)}
.info-btn{display:none}

.thread{flex:1;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-height:0}
.day{align-self:center;font-size:11.5px;color:var(--faint)}
.msg{max-width:min(560px,82%);border-radius:16px;padding:10px 14px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .t{font-size:11px;margin-top:5px;display:flex;gap:6px;align-items:center}
.msg.in{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.in .t{color:var(--faint)}
.msg.out{align-self:flex-end;background:var(--agent-bubble);color:var(--agent-ink);border-bottom-right-radius:5px}
.msg.out .t{opacity:.78;justify-content:flex-end}
.msg.note{align-self:flex-end;background:var(--note);border:1px dashed var(--note-line);color:var(--note-ink);border-radius:12px}
.msg.note .t{opacity:.85;justify-content:flex-end}
.msg .mailhead{font-size:12px;border-bottom:1px solid var(--line-2);padding-bottom:6px;margin-bottom:8px;color:var(--muted);white-space:normal}
.msg.out .mailhead{border-bottom-color:rgba(255,255,255,.22);color:inherit;opacity:.85}
.msg .mailhead b{color:inherit;font-weight:600}
.sys{align-self:center;font-size:11.5px;color:var(--muted);background:var(--line-2);padding:4px 11px;border-radius:8px;text-align:center}

.composer{background:var(--surface);border-top:1px solid var(--line);padding:10px 18px 14px}
.mode{display:flex;gap:4px;margin-bottom:8px}
.mode button{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:500;padding:5px 10px;border-radius:8px}
.mode button.on{background:var(--brown-soft);color:var(--brown)}
.mode button.on.note-on{background:var(--note);color:var(--note-ink)}
.box{border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column}
.box.note-mode{background:var(--note);border-color:var(--note-line)}
.box textarea{border:0;outline:none;background:transparent;resize:none;padding:10px 12px;min-height:64px;width:100%}
.box .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 8px 10px;flex-wrap:wrap}
.hint{font-size:11.5px;color:var(--faint)}
.canned{position:relative}
.canned-menu{position:absolute;bottom:calc(100% + 6px);left:0;width:min(320px,80vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:20}
.canned-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px}
.canned-menu button:hover{background:var(--surface-2)}
.canned-menu b{display:block;font-size:12.5px}
.canned-menu span{font-size:12px;color:var(--muted)}

/* customer panel */
.side{background:var(--surface);border-left:1px solid var(--line);padding:20px 18px;overflow:auto;min-height:0}
.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:19px;color:#fff;background:var(--sage)}
.side h2{font-size:16px;margin:10px 0 2px;font-weight:600}
.kv{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.lbl{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);margin:18px 0 8px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--sage-soft);color:var(--sage-d);font-weight:500}
.hist{display:flex;flex-direction:column;gap:6px}
.hist button{border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:8px 10px;text-align:left;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.hist button:hover{border-color:var(--brown-mid)}
.close-side{display:none}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(28,23,19,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);width:min(520px,100%);max-height:100%;overflow:auto;padding:22px 22px 18px}
.modal h3{margin:0 0 4px;font-size:18px}
.modal p.sub{margin:0 0 14px;color:var(--muted);font-size:13px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:500}
.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface-2);outline:none;width:100%;min-width:0}
.field input:focus,.field textarea:focus{border-color:var(--brown-mid)}
.chpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chpick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.chpick button svg{width:18px;height:18px}
.chpick button.on{border-color:var(--brown);background:var(--brown-soft)}
.err{color:#B4442E;font-size:12px;min-height:16px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* responsive */
@media (max-width:1180px){
  .app{grid-template-columns:68px minmax(0,320px) minmax(0,1fr)}
  .side{position:fixed;right:0;top:0;bottom:0;width:min(300px,88vw);z-index:40;box-shadow:var(--shadow);padding-top:calc(20px + env(safe-area-inset-top,0px));padding-right:max(18px, env(safe-area-inset-right,0px))}
  .side:not(.open){display:none}
  .info-btn{display:inline-flex}
  .close-side{display:inline-flex;float:right}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
  .rail{flex-direction:row;padding:8px 12px;padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px))}
  .rail img{width:34px;margin:0 8px 0 0}
  .rail button{width:38px;height:38px}
  .list,.conv{grid-column:1;grid-row:3}
  .app.show-conv .list{display:none}
  .app:not(.show-conv) .conv{display:none}
  .back{display:inline-flex}
  .thread{padding:14px}
  .composer{padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px))}
  .msg{max-width:90%}
  .actions{width:100%}
}
@media (prefers-reduced-motion:no-preference){
  .msg,.sys{animation:pop .18s ease-out}
  @keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}
}
</style>
</head>
<body>


<div class="app" id="app">

  return tickets.filter(t => (state.tab==='all' || t.status===state.tab)
    && (!state.chans.size || state.chans.has(t.channel))
    && (!q || [t.contact.name, t.subject, '#'+t.id, String(t.id), titleOf(t)].some(v => (v||'').toLowerCase().includes(q))));
}

function renderTabs(){
  const counts = {open:0,pending:0,snoozed:0,resolved:0};
  tickets.forEach(t=>counts[t.status]++);
  const tabs = [['open','Abiertos'],['pending','Pendientes'],['snoozed','Pospuestos'],['resolved','Resueltos'],['all','Todos']];
  $('#tabs').innerHTML = tabs.map(([k,l]) => `<button class="tab ${state.tab===k?'on':''}" role="tab" aria-selected="${state.tab===k}" data-tab="${k}">${l}<span class="c num">${k==='all'?tickets.length:counts[k]}</span></button>`).join('');
  $('#chans').innerHTML = Object.keys(CH).map(c => `<button class="chf ${state.chans.has(c)?'on':''}" data-ch="${c}" aria-pressed="${state.chans.has(c)}">${ICON[c]}${CH[c]}</button>`).join('');
}

function renderRows(){
  const list = filtered();
  $('#rows').innerHTML = list.length ? list.map(t => `
    <button class="row ${t.id===state.sel?'on':''} ${t.unread?'is-unread':''}" data-id="${t.id}">
      <div class="l1"><span class="who">${t.unread?'<span class="unread" aria-label="Sin leer"></span> ':''}${esc(t.contact.name)}</span><span class="when num">${esc(t.when)}</span></div>
      <div class="ttl">${esc(titleOf(t))}</div>
      <div class="prev">${esc(lastText(t))}</div>
      <div class="l3">${chip(t.channel)}<span class="tid num">#${t.id}</span><span class="st st-${t.status}">${ST[t.status]}</span><span class="who-chip">· ${esc(t.agent)}</span></div>
    </button>`).join('') : `<div class="empty">No hay conversaciones con estos filtros.</div>`;
}

function msgHtml(t,m){
  if(m.k==='sys') return `<div class="sys">${esc(m.text)}</div>`;
  if(m.k==='note') return `<div class="msg note"><b style="font-size:11.5px">Nota interna · no la ve el cliente</b>\n${esc(m.text)}<div class="t">${esc(m.by)} · ${esc(m.t)}</div></div>`;
  let head='';
  if(t.channel==='email'){
    head = m.k==='in'
      ? `<div class="mailhead">De: <b>${esc(t.contact.name)}</b> &lt;${esc(t.contact.email)}&gt;<br>Asunto: <b>${esc(t.subject)}</b></div>`
      : `<div class="mailhead">Para: <b>${esc(t.contact.email)}</b><br>Asunto: <b>Re: ${esc(t.subject)}</b></div>`;
  }
  const meta = m.k==='out' ? `${esc(m.by)} · ${esc(m.t)} ${ICON.check} ${m.via?'Enviado por '+CH[t.channel]:''}` : esc(m.t);
  return `<div class="msg ${m.k}">${head}${esc(m.text)}<div class="t">${meta}</div></div>`;
}

function renderConv(){
  const t = get(state.sel);
  if(!t){ $('#conv').innerHTML = `<div class="empty" style="margin:auto">Elige una conversación de la lista.</div>`; $('#side').innerHTML=''; return; }
  const sub = t.channel==='email' ? `<div class="subject">${esc(t.subject)}</div>` : '';
  const isClosed = t.status==='resolved';
  $('#conv').innerHTML = `
    <div class="conv-head">
      <button class="back" id="backBtn" aria-label="Volver a la lista">${ICON.back}</button>
      <div class="meta">
        <div class="name">${esc(t.contact.name)}</div>
        ${sub}
        <div class="sub">${chip(t.channel)}<span class="num">Ticket #${t.id}</span><span class="st st-${t.status}">${ST[t.status]}</span></div>
      </div>
      <div class="actions">
        <label class="sr" style="font-size:12px;color:var(--muted)" for="agentSel">Asignado a</label>
        <select class="sel" id="agentSel">${AGENTS.map(a=>`<option ${a===t.agent?'selected':''}>${a}</option>`).join('')}</select>
        <select class="sel" id="statusSel" aria-label="Estado">${Object.entries(ST).map(([k,l])=>`<option value="${k}" ${k===t.status?'selected':''}>${l}</option>`).join('')}</select>
        ${isClosed ? `<button class="btn" id="reopenBtn">Reabrir</button>` : `<button class="btn res" id="resolveBtn">${ICON.check} Resolver</button>`}
        <button class="btn ghost" id="simBtn" title="Simula que el cliente vuelve a escribir">Simular respuesta del cliente</button>
        <button class="btn info-btn" id="infoBtn" aria-label="Ver ficha del cliente">${ICON.info}Cliente</button>
      </div>
    </div>
    <div class="thread" id="thread">${t.msgs.map(m=>msgHtml(t,m)).join('')}</div>
    <div class="composer">
      <div class="mode">
        <button class="${state.mode==='reply'?'on':''}" data-mode="reply">Responder por ${CH[t.channel]}</button>
        <button class="${state.mode==='note'?'on note-on':''}" data-mode="note">Nota interna</button>
      </div>
      <div class="box ${state.mode==='note'?'note-mode':''}">
        <textarea id="reply" rows="3" aria-label="Escribe tu respuesta" placeholder="${state.mode==='note' ? 'Solo la verá el equipo' : 'Escribe la respuesta. Le llegará a ' + esc(t.contact.name) + ' por ' + CH[t.channel]}"></textarea>
        <div class="bar">
          <div class="canned">
            <button class="btn" id="cannedBtn" type="button" aria-expanded="false">Respuestas guardadas</button>
            <div class="canned-menu" id="cannedMenu" hidden>${CANNED.map((c,i)=>`<button type="button" data-canned="${i}"><b>${c.k}</b><span>${esc(c.t.slice(0,70))}…</span></button>`).join('')}</div>
          </div>
          <span class="hint">Ctrl + Enter para enviar</span>
          <button class="btn primary" id="sendBtn">${state.mode==='note' ? 'Guardar nota' : 'Enviar'}</button>
        </div>
      </div>
    </div>`;
  const th=$('#thread'); th.scrollTop = th.scrollHeight;
  renderSide(t);
}

function renderSide(t){
  const c=t.contact;
  const prev = t.history.map(id=>OLD[id]).filter(Boolean);
  const others = tickets.filter(x=>x.id!==t.id && x.contact.name===c.name);
  $('#side').classList.toggle('open', state.showSide);
  $('#side').innerHTML = `
    <button class="btn close-side" id="closeSide" aria-label="Cerrar ficha">Cerrar</button>
    <div class="avatar" style="background:${avColor(c.name)}">${esc(initials(c.name))}</div>
    <h2>${esc(c.name)}</h2>
    <div class="kv">${c.phone?`<span class="num">${esc(c.phone)}</span>`:''}${c.email?`<span>${esc(c.email)}</span>`:''}${!c.phone&&!c.email?`<span>Perfil de ${CH[t.channel]}</span>`:''}</div>
    <div class="lbl">Etiquetas</div>
    <div class="tags">${t.labels.length ? t.labels.map(l=>`<span class="tag">${esc(l)}</span>`).join('') : '<span class="kv">Sin etiquetas</span>'}</div>
    <div class="lbl">Conversaciones anteriores</div>
    <div class="hist">${(others.map(o=>`<button data-id="${o.id}"><span>${chip(o.channel)} <span class="tid num">#${o.id}</span></span>${esc(titleOf(o))}</button>`).join('') + prev.map((p,i)=>`<button disabled><span>${chip(p.channel)} <span class="tid num">#${t.history[i]}</span> · ${p.when}</span>${esc(p.title)}</button>`).join('')) || '<span class="kv">Es su primera conversación</span>'}</div>
    <div class="lbl">Responsable</div>
    <div class="kv">${esc(t.agent)}</div>`;
}

function render(){ renderTabs(); renderRows(); renderConv(); }

function send(){
  const t=get(state.sel); const box=$('#reply'); const text=box.value.trim();
  if(!text){ box.focus(); toast('Escribe algo antes de enviar'); return; }
  if(state.mode==='note'){
    t.msgs.push({k:'note', text, t:now(), by:ME});
    toast('Nota guardada. El cliente no la ve');
  } else {
    t.msgs.push({k:'out', text, t:now(), by:ME, via:true});
    if(t.status==='resolved' || t.status==='snoozed'){ t.status='open'; }
    t.when=now();
    toast(`Respuesta enviada por ${CH[t.channel]} a ${t.contact.name}`);
  }
  t.unread=false; render();
}

function simulate(){
  const t=get(state.sel);
  const replies = {
    whatsapp:'¡Perfecto, muchas gracias! 🙌',
    email:'Muchas gracias por la respuesta. Lo confirmo esta tarde.\n\nUn saludo',
    instagram:'¡Sí, porfa! Paso a recogerla mañana 🥰',
    facebook:'¡Genial, gracias!'};
  const wasClosed = t.status==='snoozed' || t.status==='resolved';
  t.msgs.push({k:'in', text:replies[t.channel], t:now()});
  if(wasClosed){ t.msgs.push({k:'sys', text:'Conversación reabierta: el cliente ha vuelto a escribir'}); t.status='open'; }
  t.when=now(); t.unread=false;
  // move to top
  tickets = [t, ...tickets.filter(x=>x!==t)];
  if(state.tab!=='all' && state.tab!==t.status) state.tab=t.status;
  render();
  toast(wasClosed ? `${t.contact.name} ha respondido y el ticket #${t.id} se ha reabierto` : `Nuevo mensaje de ${t.contact.name}`);
}

/* new ticket modal */
function openModal(){
  $('#scrim').hidden=false; $('#f-err').textContent='';
  $('#f-agent').innerHTML = AGENTS.map(a=>`<option ${a===ME?'selected':''}>${a}</option>`).join('');
  setNewCh(state.newCh); $('#f-name').focus();
}
function closeModal(){ $('#scrim').hidden=true; $('#form').reset(); }
function setNewCh(ch){
  state.newCh=ch;
  $('#chpick').innerHTML = Object.keys(CH).map(c=>`<button type="button" class="${c===ch?'on':''}" data-newch="${c}" aria-pressed="${c===ch}">${ICON[c]}${CH[c]}</button>`).join('');
  const lab = {email:['Email','ana@ejemplo.com'], whatsapp:['Teléfono','+34 600 000 000'], instagram:['Usuario de Instagram','@usuario'], facebook:['Nombre en Facebook','Ana López']}[ch];
  $('#f-contact-l').textContent=lab[0]; $('#f-contact').placeholder=lab[1];
  $('#f-subject-w').hidden = ch!=='email';
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) { if(!e.target.closest('.canned')) { const m=$('#cannedMenu'); if(m) m.hidden=true; } return; }
  if(b.dataset.tab){ state.tab=b.dataset.tab; render(); return; }
  if(b.dataset.ch){ const c=b.dataset.ch; state.chans.has(c)?state.chans.delete(c):state.chans.add(c); render(); return; }
  if(b.dataset.id && !b.disabled){ state.sel=+b.dataset.id; const t=get(state.sel); t.unread=false; state.mode='reply'; state.showSide=false; $('#app').classList.add('show-conv'); render(); return; }
  if(b.dataset.mode){ state.mode=b.dataset.mode; const v=$('#reply').value; renderConv(); $('#reply').value=v; $('#reply').focus(); return; }
  if(b.dataset.canned){ const r=$('#reply'); r.value = (r.value ? r.value+'\n' : '') + CANNED[+b.dataset.canned].t; $('#cannedMenu').hidden=true; r.focus(); return; }
  if(b.dataset.newch){ setNewCh(b.dataset.newch); return; }
  switch(b.id){
    case 'newBtn': openModal(); break;
    case 'cancelBtn': closeModal(); break;
    case 'sendBtn': send(); break;
    case 'simBtn': simulate(); break;
    case 'backBtn': $('#app').classList.remove('show-conv'); break;
    case 'infoBtn': state.showSide=true; $('#side').classList.add('open'); break;
    case 'closeSide': state.showSide=false; $('#side').classList.remove('open'); break;
    case 'cannedBtn': { const m=$('#cannedMenu'); m.hidden=!m.hidden; b.setAttribute('aria-expanded', String(!m.hidden)); break; }
    case 'resolveBtn': { const t=get(state.sel); t.status='resolved'; t.msgs.push({k:'sys', text:`${ME} ha marcado la conversación como resuelta`}); render(); toast(`Ticket #${t.id} resuelto`); break; }
    case 'reopenBtn': { const t=get(state.sel); t.status='open'; t.msgs.push({k:'sys', text:`${ME} ha reabierto la conversación`}); state.tab='open'; render(); break; }
  }
});
document.addEventListener('change', e => {
  const t=get(state.sel);
  if(e.target.id==='agentSel'){ t.agent=e.target.value; t.msgs.push({k:'sys', text:`${ME} ha asignado la conversación a ${t.agent}`}); render(); toast(`Asignado a ${t.agent}`); }
  if(e.target.id==='statusSel'){ const v=e.target.value; t.status=v; t.msgs.push({k:'sys', text:`${ME} ha cambiado el estado a ${ST[v]}`}); render(); toast(`Estado: ${ST[v]}`); }
});
document.addEventListener('keydown', e => {
  if(e.key==='Enter' && (e.ctrlKey||e.metaKey) && e.target.id==='reply'){ e.preventDefault(); send(); }
  if(e.key==='Escape' && !$('#scrim').hidden) closeModal();
});
$('#q').addEventListener('input', e => { state.q=e.target.value; renderRows(); });
$('#scrim').addEventListener('click', e => { if(e.target.id==='scrim') closeModal(); });
$('#form').addEventListener('submit', e => {
  e.preventDefault();
  const ch=state.newCh, name=$('#f-name').value.trim(), contact=$('#f-contact').value.trim(), subject=$('#f-subject').value.trim(), msg=$('#f-msg').value.trim(), agent=$('#f-agent').value;
  const missing = [!name&&'el nombre', !contact&&$('#f-contact-l').textContent.toLowerCase(), ch==='email'&&!subject&&'el asunto', !msg&&'el mensaje'].filter(Boolean);
  if(missing.length){ $('#f-err').textContent = 'Falta ' + missing.join(', ') + '.'; return; }
  if(ch==='email' && !/^\S+@\S+\.\S+$/.test(contact)){ $('#f-err').textContent='El email no parece válido. Revisa que tenga @ y dominio.'; return; }
  const t = {id:nextId++, channel:ch, status:'open', agent, unread:true, when:now(), subject: ch==='email'?subject:undefined,
    contact:{name: ch==='instagram' && !name.startsWith('@') ? name : name, email: ch==='email'?contact:'', phone: ch==='whatsapp'?contact:''},
    labels:[], history:[], msgs:[{k:'in', text:msg, t:now()}, {k:'sys', text:`Ticket creado por ${ME} y asignado a ${agent}`}]};
  tickets.unshift(t); state.sel=t.id; state.tab='open'; state.chans.clear(); state.q=''; $('#q').value='';
  closeModal(); $('#app').classList.add('show-conv'); render();
  toast(`Ticket #${t.id} creado · ${CH[ch]}`);
});

render();
</script>

</body>
</html>
